      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install just
        run: cargo install just

      - name: Setup project (install frontend deps & build FFmpeg)
        run: just setup

      - name: Build frontend
        run: just web-build

      - name: Build the application
        run: cargo build --release
